name: Build & Verify for Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 🏗️ Build & Test Application
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Typecheck & Lint
        run: npm run lint

      - name: 🚀 Build Production Bundle for Netlify
        run: npm run build

      # If you set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub Secrets,
      # this step will automatically deploy the site via Netlify CLI.
      # (If you connected GitHub directly in app.netlify.com, Netlify deploys automatically!)
      - name: 🌐 Deploy to Netlify (Optional via Secrets)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
